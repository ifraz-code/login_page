<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureus — Portal Access</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Live Video Background -->
  <video autoplay loop muted playsinline id="bg-video">
    <source src="walpaper.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>

  <!-- Dark Tint Overlay -->
  <div class="video-overlay"></div>

  <!-- Interactive Golden Ember Particle Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Ambient Glow Overlay -->
  <div class="ambient-glow"></div>

  <!-- Video Playback & Audio Controls -->
  <div class="video-controls">
    <button type="button" id="toggle-video-btn" onclick="toggleVideoPlayback()" title="Pause/Play Video" aria-label="Pause background video">
      ⏸
    </button>
  </div>

  <!-- Main Left-Aligned Card Container -->
  <div class="login-card">
    
    <!-- Brand Header -->
    <div class="card-header">
      <div class="brand-badge">❖</div>
      <h1 class="brand-title">AUREUS</h1>
      <p class="brand-subtitle" id="header-subtitle">Enter your credentials to access your portal</p>
    </div>

    <!-- Mode Switcher Tabs -->
    <div class="auth-tabs" role="tablist">
      <button class="tab-btn active" id="tab-signin" role="tab" aria-selected="true" onclick="switchTab('signin')">Sign In</button>
      <button class="tab-btn" id="tab-signup" role="tab" aria-selected="false" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast-message" class="toast hidden" role="alert"></div>

    <!-- Rate Limit Cooldown Warning -->
    <div id="cooldown-banner" class="cooldown-banner hidden">
      Too many failed attempts. Please wait <span id="cooldown-timer">30</span>s.
    </div>

    <!-- ================= SIGN IN FORM ================= -->
    <form id="signin-form" class="auth-form" onsubmit="handleSignIn(event)" novalidate>
      <div class="field-group">
        <input type="email" id="signin-email" placeholder=" " required autocomplete="email" oninput="validateInput(this, validateEmail)">
        <label for="signin-email">Email Address</label>
        <span class="status-icon" id="signin-email-status"></span>
        <span class="error-msg" id="signin-email-err"></span>
      </div>

      <div class="field-group">
        <input type="password" id="signin-password" placeholder=" " required autocomplete="current-password" oninput="validateInput(this, val => val.length > 0)">
        <label for="signin-password">Password</label>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signin-password', this)" aria-label="Show password" aria-expanded="false">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <span class="status-icon password-status" id="signin-password-status"></span>
        <span class="error-msg" id="signin-password-err"></span>
      </div>

      <div class="form-utilities">
        <label class="custom-checkbox">
          <input type="checkbox" id="remember-me">
          <span class="checkmark"></span>
          Remember device
        </label>
        <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" id="signin-submit">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner hidden"></span>
        <span class="btn-arrow">&rarr;</span>
      </button>
    </form>

    <!-- ================= SIGN UP FORM ================= -->
    <form id="signup-form" class="auth-form hidden" onsubmit="handleSignUp(event)" novalidate>
      <div class="field-group">
        <input type="text" id="signup-name" placeholder=" " required autocomplete="name" oninput="validateInput(this, val => val.trim().length > 2)">
        <label for="signup-name">Full Name</label>
        <span class="status-icon" id="signup-name-status"></span>
        <span class="error-msg" id="signup-name-err"></span>
      </div>

      <div class="field-group">
        <input type="email" id="signup-email" placeholder=" " required autocomplete="email" oninput="validateInput(this, validateEmail)">
        <label for="signup-email">Email Address</label>
        <span class="status-icon" id="signup-email-status"></span>
        <span class="error-msg" id="signup-email-err"></span>
      </div>

      <div class="field-group">
        <input type="password" id="signup-password" placeholder=" " required autocomplete="new-password" oninput="onSignUpPasswordInput(this.value)">
        <label for="signup-password">Password</label>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('signup-password', this)" aria-label="Show password" aria-expanded="false">
          <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <span class="status-icon password-status" id="signup-password-status"></span>
        <div class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
        <span class="error-msg" id="signup-password-err"></span>
      </div>

      <div class="field-group">
        <input type="password" id="signup-confirm-password" placeholder=" " required autocomplete="new-password" oninput="validateConfirmPassword(this)">
        <label for="signup-confirm-password">Confirm Password</label>
        <span class="status-icon" id="signup-confirm-status"></span>
        <span class="error-msg" id="signup-confirm-err"></span>
      </div>

      <div class="form-utilities">
        <label class="custom-checkbox">
          <input type="checkbox" id="accept-terms">
          <span class="checkmark"></span>
          I agree to the <a href="#" class="create-account">Terms of Service</a>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="signup-submit">
        <span class="btn-text">Create Account</span>
        <span class="btn-spinner hidden"></span>
        <span class="btn-arrow">&rarr;</span>
      </button>
    </form>

    <!-- Social Authentication Divider -->
    <div class="divider">
      <span>Or Continue With</span>
    </div>

    <div class="social-actions">
      <button type="button" class="social-btn" onclick="triggerSocialAuth('Google')">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google
      </button>
      <button type="button" class="social-btn" onclick="triggerSocialAuth('GitHub')">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        GitHub
      </button>
    </div>

    <!-- Toggle Footer -->
    <div class="card-footer" id="footer-text">
      Don't have an account? <a href="#" class="create-account" onclick="switchTab('signup'); return false;">Create an account</a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
